version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=visitor_user
      - DB_PASSWORD=visitor_password
      - DB_NAME=visitor_assistance
      - JWT_SECRET=your_jwt_secret_change_in_production
      - AT_USERNAME=your_at_username
      - AT_API_KEY=your_at_api_key
      - OPENCELLID_API_KEY=your_opencellid_key
      - VOICE_CALLBACK_URL=https://yourdomain.com/voice/callback
      - USSD_CALLBACK_URL=https://yourdomain.com/ussd/callback
    depends_on:
      - mysql
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=visitor_assistance
      - MYSQL_USER=visitor_user
      - MYSQL_PASSWORD=visitor_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data: